<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Shape -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="#041f18" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- Football pattern -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <circle cx="0" cy="0" r="110" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
    <!-- Center pentagon -->
    <polygon points="0,-48 45,-15 28,38 -28,38 -45,-15" fill="#0f172a"/>
    <!-- Outer pentagons and seams -->
    <path d="M0,-48 L0,-110" stroke="#0f172a" stroke-width="6"/>
    <path d="M45,-15 L95,-38" stroke="#0f172a" stroke-width="6"/>
    <path d="M28,38 L72,82" stroke="#0f172a" stroke-width="6"/>
    <path d="M-28,38 L-72,82" stroke="#0f172a" stroke-width="6"/>
    <path d="M-45,-15 L-95,-38" stroke="#0f172a" stroke-width="6"/>
    <polygon points="0,-110 32,-105 45,-75 0,-85" fill="#0f172a" opacity="0.9"/>
    <polygon points="95,-38 108,-15 90,15 75,-10" fill="#0f172a" opacity="0.9"/>
    <polygon points="-95,-38 -108,-15 -90,15 -75,-10" fill="#0f172a" opacity="0.9"/>
    <polygon points="72,82 82,65 55,48 40,70" fill="#0f172a" opacity="0.9"/>
    <polygon points="-72,82 -82,65 -55,48 -40,70" fill="#0f172a" opacity="0.9"/>
  </g>

  <!-- Live Pulse Dot and Ribbon -->
  <g transform="translate(256, 390)">
    <rect x="-140" y="-22" width="280" height="44" rx="22" fill="#10b981"/>
    <circle cx="-100" cy="0" r="7" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="5" y="7" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="3" text-anchor="middle">LIGA MX VIVO</text>
  </g>
</svg>
