<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Path -->
  <path d="M 50,4 C 75,4 92,16 92,38 C 92,75 50,112 50,112 C 50,112 8,75 8,38 C 8,16 25,4 50,4 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#borderGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />
        
  <!-- Inner Subtle Border -->
  <path d="M 50,12 C 70,12 84,22 84,40 C 84,70 50,102 50,102 C 50,102 16,70 16,40 C 16,22 30,12 50,12 Z" 
        fill="none" 
        stroke="#64748b" 
        stroke-width="1.5" 
        stroke-dasharray="3,3" 
        opacity="0.6" />

  <!-- Shield Crest Symbol (Question mark / subtle soccer ball outline) -->
  <path d="M 42,38 C 42,32 46,28 50,28 C 54.5,28 58,31.5 58,36 C 58,41 53,44 50,47 L 50,54" 
        fill="none" 
        stroke="#cbd5e1" 
        stroke-width="4" 
        stroke-linecap="round" />
  <circle cx="50" cy="64" r="2.8" fill="#cbd5e1" />
  
  <!-- Text TBD below -->
  <text x="50" y="86" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="11" 
        font-weight="900" 
        fill="#94a3b8" 
        text-anchor="middle" 
        letter-spacing="1">TBD</text>
</svg>
